[package]
name = "bullmq-bench"
version = "0.1.2"
edition = "2021"

[lib]
# Exposes job/metrics/producer/worker so `tests/` integration tests can drive
# real Queue/Worker plumbing without re-implementing it. See src/lib.rs.
name = "bullmq_bench"
path = "src/lib.rs"

[[bin]]
name = "bullmq-bench"
path = "src/main.rs"

[dependencies]
# BullMQ's own first-party Rust client (crates.io name: bullmq-official; the
# library itself is imported as `bullmq` — see its Cargo.toml [lib] name).
# https://github.com/taskforcesh/bullmq/tree/master/rust
# https://crates.io/crates/bullmq-official
# Built and tested against 1.2.5 (published 2026-08-15 by manast; 1.2.4's
# only change was an internal SCRIPT EXISTS check before loading Lua scripts
# — taskforcesh/bullmq#4563 — no API or protocol changes). Pinned to the 1.2
# line since this crate is brand-new and still evolving quickly — see
# README's "Protocol compatibility" section for exact version notes.
bullmq-official = "1.2"

# Redis client — used directly (outside the bullmq-official crate) for the
# one-off INFO tag lookup and --allow-flushdb. bullmq-official pins an exact
# "=1.5.0"; we track the same minor line so the dependency graph unifies.
redis = { version = "1.5", features = ["tokio-comp", "tokio-rustls-comp", "tls-rustls-webpki-roots", "tls-rustls-insecure"] }

# Direct dependency on rustls purely to select+install a process-wide default
# CryptoProvider (see main()'s first line). `redis`'s own Cargo.toml pulls in
# rustls with `default-features = false` and only requests the "std" feature
# (verified via `cargo tree -e features -i rustls`) — it does NOT enable
# either crypto backend ("ring" / "aws_lc_rs"), so nothing in the dependency
# graph installs one on our behalf. Without this, `rustls::ClientConfig::builder()`
# (called by redis-rs's TLS connector on *every* rediss:// connection, both
# verifying and --insecure) panics with "Could not automatically determine
# the process-level CryptoProvider...". "ring" is picked over "aws_lc_rs" for
# build simplicity, not because it avoids a C toolchain — it still compiles C
# and assembly (that's exactly why .github/workflows/release.yml's musl
# targets install `musl-tools`, per that workflow's own comment). The actual
# advantage over "aws_lc_rs" is not needing cmake or NASM.
#
# NOTE: this crate's own rustls dependency must resolve (via Cargo's semver
# unification) to the *same* rustls instance `redis`'s internal rustls
# dependency links against — see main()'s install_crypto_provider() for what
# breaks if it doesn't. `cargo tree -i rustls` can confirm there's only one.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Latency histogram
hdrhistogram = "7"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
anyhow = "1"

# Table formatting
comfy-table = "7"

# Time formatting
chrono = { version = "0.4", features = ["serde"] }

# URL parsing — safe password encoding and redaction
url = "2"

# Concurrent worker spawn/close (join_all / try_join_all)
futures = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
