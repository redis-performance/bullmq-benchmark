[package]
name = "bullmq-bench"
version = "0.1.1"
edition = "2021"

[lib]
# Exposes job/metrics/producer/worker so `tests/` integration tests can drive
# real Queue/Worker plumbing without re-implementing it. See src/lib.rs.
name = "bullmq_bench"
path = "src/lib.rs"

[[bin]]
name = "bullmq-bench"
path = "src/main.rs"

[dependencies]
# BullMQ's own first-party Rust client (crates.io name: bullmq-official; the
# library itself is imported as `bullmq` — see its Cargo.toml [lib] name).
# https://github.com/taskforcesh/bullmq/tree/master/rust
# https://crates.io/crates/bullmq-official
# Built and tested against 1.2.5 (published 2026-08-15 by manast; 1.2.4's
# only change was an internal SCRIPT EXISTS check before loading Lua scripts
# — taskforcesh/bullmq#4563 — no API or protocol changes). Pinned to the 1.2
# line since this crate is brand-new and still evolving quickly — see
# README's "Protocol compatibility" section for exact version notes.
bullmq-official = "1.2"

# Redis client — used directly (outside the bullmq-official crate) for the
# one-off INFO tag lookup and --allow-flushdb. bullmq-official pins an exact
# "=1.5.0"; we track the same minor line so the dependency graph unifies.
redis = { version = "1.5", features = ["tokio-comp", "tokio-rustls-comp", "tls-rustls-webpki-roots"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Latency histogram
hdrhistogram = "7"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
anyhow = "1"

# Table formatting
comfy-table = "7"

# Time formatting
chrono = { version = "0.4", features = ["serde"] }

# URL parsing — safe password encoding and redaction
url = "2"

# Concurrent worker spawn/close (join_all / try_join_all)
futures = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
