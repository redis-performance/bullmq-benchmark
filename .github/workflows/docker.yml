name: Docker

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# Least-privilege default. Note this workflow deliberately has no
# `pull_request` trigger (only `push`/`workflow_dispatch`), so DOCKERHUB_*
# secrets are never evaluated against an untrusted fork's PR code/context —
# don't add `pull_request` here without also isolating the secrets.
permissions:
  contents: read

jobs:
  build-push:
    name: Build and push multi-platform image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: redis/bullmq-benchmark
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
